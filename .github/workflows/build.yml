name: Build OpenWrt 25.12 for Cudy TR3600 v1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 rsync unzip zlib1g-dev file wget qemu-utils \
            libelf-dev dwarves zstd swig

      - name: Clone OpenWrt (openwrt-25.12 branch)
        run: git clone --depth 1 -b openwrt-25.12 https://github.com/openwrt/openwrt.git openwrt

      - name: Apply TR3600 device patch
        run: |
          cd openwrt
          git apply ../patches/*.patch

      - name: Add feeds and update
        run: |
          cd openwrt
          echo 'src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages.git;main' >> feeds.conf.default
          echo 'src-git passwall https://github.com/xiaorouji/openwrt-passwall.git;main' >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp ../config.seed .config
          make defconfig

      - name: Download sources
        run: |
          cd openwrt
          make download -j$(nproc)

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-tr3600-v1
          path: |
            openwrt/bin/targets/mediatek/filogic/*sysupgrade.bin
            openwrt/bin/targets/mediatek/filogic/sha256sums
            openwrt/bin/targets/mediatek/filogic/profiles.json
          retention-days: 30
